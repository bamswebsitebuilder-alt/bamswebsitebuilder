name: Domain checkout safety tests
on:
  pull_request:
    paths:
      - 'api/domain-*'
      - 'lib/domain-*'
      - 'tests/domain-*'
      - 'package.json'
      - '.github/workflows/domain-checkout-tests.yml'
  push:
    branches:
      - 'feature/paypal-domain-storefront-20261021'
    paths:
      - 'api/domain-*'
      - 'lib/domain-*'
      - 'tests/domain-*'
      - 'package.json'
      - '.github/workflows/domain-checkout-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated domain safeguards
        run: npm test

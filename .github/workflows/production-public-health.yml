name: Production public health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-public-health.yml'
      - 'tests/production-public-health.test.mjs'
  schedule:
    - cron: '17 12 * * 1'

permissions:
  contents: read

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check public production pages without submissions
        run: node --test tests/production-public-health.test.mjs

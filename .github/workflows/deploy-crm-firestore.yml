name: Deploy CRM Firestore rules
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    environment: firebase-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --prefix tests/crm --no-audit --no-fund
      - name: Verify rules against emulator
        run: npx --yes firebase-tools@14.19.1 emulators:exec --only firestore --project crm-rules-ci 'cd tests/crm && npm test'
      - name: Deploy only Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-deployer.json
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || { echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npx --yes firebase-tools@14.19.1 deploy --only firestore:rules --project bam-client-portal --non-interactive

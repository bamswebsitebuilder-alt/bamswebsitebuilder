name: Public site smoke checks
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'vercel.json'
      - 'js/site-analytics.js'
      - 'tests/public-site-smoke.test.mjs'
      - '.github/workflows/public-site-smoke.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run site smoke checks
        run: node --test tests/public-site-smoke.test.mjs

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d4a637">
  <title>You're Offline | BAM's Website Builder</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#050505;color:#fff;font-family:Arial,sans-serif;text-align:center}.card{width:min(100%,520px);padding:42px 28px;background:#111;border:1px solid rgba(212,166,55,.5);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.5)}.mark{display:grid;place-items:center;width:92px;height:92px;margin:0 auto 24px;border:3px solid #d4a637;border-radius:24px;color:#f1c75b;font-size:24px;font-weight:800}h1{margin:0 0 12px;color:#f1c75b;font-size:32px}p{margin:0 0 26px;color:#d6d6d6;line-height:1.65}button{padding:14px 22px;border:0;border-radius:999px;background:#d4a637;color:#050505;font-weight:800;font-size:16px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">BAM'S</div>
    <h1>You're Offline</h1>
    <p>Please reconnect to the internet, then try again. Your account and private client information are never stored in the offline cache.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
  </main>
</body>
</html>

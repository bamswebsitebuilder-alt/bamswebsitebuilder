<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Nonbinding agreement preview test</title><link rel="stylesheet" href="/css/agreements.css"><style>body{max-width:900px;margin:auto;padding:24px;font:16px/1.6 Arial;background:#111;color:#eee}button{background:#d4a637;color:#111;padding:12px;border:0;border-radius:8px;font:inherit}h1{line-height:1.2}</style></head><body><main><h1>TEST ONLY — no contract or payment</h1><p>This isolated preview exercises the agreement interface without creating a real quote, signing a contract, or writing any client data.</p><div id="preview" class="agreement-card"></div><p id="test-result" role="status"></p></main><script type="module">
import {renderAgreement} from '/js/agreement-view.js';
import {validateAcceptance,ACCEPTANCE_STATEMENT,downloadAgreement} from '/js/agreement-model.js';
const timestamp=date=>({toDate:()=>date});
const quote={id:'TEST-ONLY',quoteNumber:'NONBINDING-TEST',clientName:'Test Client',clientEmail:'client@example.test',providerName:'TEST ONLY — no contract',projectName:'Agreement preview',amount:250,revisions:2,scope:'Three pages: home, about, contact. Files and account handover after full payment.',paymentSchedule:'50% before work; 50% after preview approval, before launch.',delivery:'2–3 weeks after acceptance, first payment and materials.',ongoingCosts:'Hosting and domain fees confirmed separately before purchase.',variations:'None.',termsVersion:'1-2026-10-10',termsText:(await (await fetch('/js/project-terms-v1.json')).json()).en,issuedAt:timestamp(new Date()),expiresAt:timestamp(new Date(Date.now()+86400000))};
let acceptance=null;const host=document.getElementById('preview');
function render(){renderAgreement(host,quote,acceptance,{download:()=>downloadAgreement(quote,acceptance),accept:async(name,checked)=>{validateAcceptance(quote,acceptance,name,checked);acceptance={name,email:quote.clientEmail,acceptedAt:timestamp(new Date()),statement:ACCEPTANCE_STATEMENT};document.getElementById('test-result').textContent='PASS — local test receipt rendered. No production data written.';render();}});}
render();
</script></body></html>
